{% extends "base.html" %}
{% block content %}
    <div class="flex min-h-[calc(100vh-4.25rem)] items-center justify-center bg-gray-100 p-6">
        <form action=""
              method="post"
              class="w-full max-w-md space-y-6 rounded-xl bg-white p-8 text-center shadow-lg">
            {% csrf_token %}
            <div class="mx-auto flex size-14 items-center justify-center rounded-full bg-red-100">
                <span class="text-2xl text-red-600">!</span>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-bold text-gray-900">Delete item?</h2>
                <p class="text-sm text-gray-600">
                    Are you sure you want to delete this item?
                    This action cannot be undone.
                </p>
            </div>
            <div class="flex gap-3">
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
                   class="flex-1 rounded-lg border border-gray-300 px-4 py-2 font-medium text-gray-700 transition hover:bg-gray-100">
                    Cancel
                </a>
                <button type="submit"
                        class="cursor-pointer flex-1 rounded-lg bg-red-600 px-4 py-2 font-medium text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 pointer">
                    Confirm
                </button>
            </div>
        </form>
    </div>
{% endblock content %}
